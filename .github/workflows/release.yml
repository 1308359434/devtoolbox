name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean --onedir --name DevToolBox --exclude-module tkinter --exclude-module matplotlib --exclude-module numpy --exclude-module PySide6.WebEngine --exclude-module PySide6.QtWebEngineCore src/devtoolbox/__main__.py
      - name: Copy license notices
        run: |
          Copy-Item LICENSE dist/DevToolBox/
          Copy-Item THIRD_PARTY_NOTICES.md dist/DevToolBox/
      - name: Zip portable build
        run: Compress-Archive -Path dist/DevToolBox/* -DestinationPath DevToolBox-portable-win.zip
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: DevToolBox-portable-win.zip
          generate_release_notes: true
