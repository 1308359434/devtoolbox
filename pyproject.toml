[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devtoolbox"
version = "0.1.0"
description = "离线优先、零遥测、跨平台的开发者工具箱"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "1308359434" }]
keywords = ["developer-tools", "desktop", "offline", "PySide6", "utilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Utilities",
]
dependencies = ["PySide6>=6.9,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6"]

[project.scripts]
devtoolbox = "devtoolbox.app:main"

[project.urls]
Homepage = "https://github.com/1308359434/devtoolbox"
Repository = "https://github.com/1308359434/devtoolbox"
Issues = "https://github.com/1308359434/devtoolbox/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
